<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Órdenes · Restaurante</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="layout">
    <header>
      <h1>Sistema de Órdenes</h1>
      <p id="estado"></p>
    </header>

    <main>
      <section id="acceso">
        <h2>Acceso de Clientes</h2>

        <article class="bloque">
          <h3>Crear cuenta</h3>
          <form id="registro-form">
            <label>
              Nombre completo
              <input id="reg-nombre" required>
            </label>
            <label>
              Correo electrónico
              <input id="reg-correo" type="email" required>
            </label>
            <label>
              Teléfono
              <input id="reg-telefono" required>
            </label>
            <button type="submit">Crear usuario</button>
          </form>
        </article>

        <article class="bloque">
          <h3>Ingreso rápido</h3>
          <form id="login-form">
            <label>
              Correo
              <input id="log-correo" type="email" required>
            </label>
            <label>
              Teléfono
              <input id="log-telefono" required>
            </label>
            <button type="submit">Entrar al sistema</button>
          </form>
        </article>
      </section>

      <section id="panel" class="oculto">
        <h2 id="mensaje-bienvenida"></h2>

        <article class="tarjeta">
          <h3>Agregar nueva orden</h3>
          <form id="orden-form">
            <label>
              Nombre del platillo
              <input id="orden-plato" placeholder="Ejemplo: Pizza Margarita" required>
            </label>
            <label>
              Observaciones o extras
              <input id="orden-extras" placeholder="Sin queso, extra salsa">
            </label>
            <button type="submit">Guardar orden</button>
          </form>
        </article>

        <article class="tarjeta">
          <h3>Listado de mis órdenes</h3>
          <div id="ordenes-lista"></div>
        </article>
      </section>
    </main>

    <footer>
      <small>© 2025 · Restaurante Online</small>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>

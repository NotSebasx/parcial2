<script>
  const $ = (sel) => document.querySelector(sel);

  const state = { cliente: null };

  function setStatus(msg){ $('#estado').textContent = msg || ''; }

  function showApp(){
    $('#acceso').classList.add('oculto');
    $('#panel').classList.remove('oculto');
    $('#mensaje-bienvenida').textContent = `Bienvenido ${state.cliente.nombre}`;
  }

  // Registro
  $('#registro-form').addEventListener('submit', e => {
    e.preventDefault();
    state.cliente = { 
      nombre: $('#reg-nombre').value,
      correo: $('#reg-correo').value,
      telefono: $('#reg-telefono').value
    };
    setStatus(`Usuario creado: ${state.cliente.nombre}`);
    showApp();
  });

  // Login
  $('#login-form').addEventListener('submit', e => {
    e.preventDefault();
    state.cliente = { 
      nombre: "Usuario", // Aquí puedes simular que traes el nombre de la base
      correo: $('#log-correo').value,
      telefono: $('#log-telefono').value
    };
    setStatus(`Bienvenido: ${state.cliente.nombre}`);
    showApp();
  });

  // Agregar nueva orden con estado
  $('#orden-form').addEventListener('submit', e => {
    e.preventDefault();
    const plato = $('#orden-plato').value;
    const extras = $('#orden-extras').value;

    const div = document.createElement('div');
    div.className = 'orden';
    div.innerHTML = `
      <strong>Platillo:</strong> ${plato} <br>
      <strong>Extras:</strong> ${extras} <br>
      <strong>Estado:</strong>
      <select class="estado-orden">
        <option value="Pendiente" selected>Pendiente</option>
        <option value="En preparación">En preparación</option>
        <option value="Listo">Listo</option>
        <option value="Entregado">Entregado</option>
      </select>
    `;
    
    $('#ordenes-lista').appendChild(div);
    $('#orden-plato').value = '';
    $('#orden-extras').value = '';
  });

  // Actualizar estado de orden (opcional: mostrar mensaje)
  document.addEventListener('change', e => {
    if(e.target.classList.contains('estado-orden')){
      setStatus(`Estado de la orden actualizado a: ${e.target.value}`);
      setTimeout(() => setStatus(''), 2000); // borrar mensaje después de 2s
    }
  });
</script>
